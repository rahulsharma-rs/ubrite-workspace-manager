{% extends 'base.html' %}

{% block title %}Server Error - UBRITE{% endblock %}

{% block header %}Server Error{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card">
            <div class="card-body text-center">
                <h1 class="display-1 text-muted">500</h1>
                <h4 class="card-title">Internal Server Error</h4>
                <p class="card-text">
                    Something went wrong on our end. Please try again later.
                </p>
                <a href="{{ url_for('dashboard.index') }}" class="btn btn-primary">
                    <span data-feather="home"></span>
                    Go to Dashboard
                </a>
                <a href="javascript:history.back()" class="btn btn-outline-secondary">
                    <span data-feather="arrow-left"></span>
                    Go Back
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
