{% extends 'base.html' %}

{% block title %}Bad Request - UBRITE{% endblock %}

{% block header %}Bad Request{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card">
            <div class="card-body text-center">
                <h1 class="display-1 text-muted">400</h1>
                <h4 class="card-title">Bad Request</h4>
                <p class="card-text">
                    Your request could not be processed. This might be due to a missing or invalid CSRF token.
                </p>
                <a href="{{ url_for('dashboard.index') }}" class="btn btn-primary">
                    <span data-feather="home"></span>
                    Go to Dashboard
                </a>
                <a href="javascript:location.reload()" class="btn btn-outline-secondary">
                    <span data-feather="refresh-cw"></span>
                    Refresh Page
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
