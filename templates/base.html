<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Base Template</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body>

    <div class="container">
        {% block content %}
        {% endblock %}
    </div>

    <script>
        // Global error handler for AJAX requests
        $(document).ajaxError(function(event, xhr, settings, thrownError) {
            console.error('AJAX Error:', {
                url: settings.url,
                status: xhr.status,
                error: thrownError,
                response: xhr.responseText
            });

            // Show user-friendly error message
            if (xhr.status === 401) {
                if (typeof showGlobalAlert === 'function') {
                    showGlobalAlert('Session expired. Please refresh the page.', 'warning');
                }
            } else if (xhr.status >= 500) {
                if (typeof showGlobalAlert === 'function') {
                    showGlobalAlert('Server error. Please try again later.', 'error');
                }
            }
        });

        // Global function to handle API errors consistently
        window.handleGlobalAPIError = function(error, operation) {
            console.error(`Error ${operation}:`, error);

            let message = `Failed to ${operation}`;

            if (error.status === 401) {
                message = 'Authentication required. Please refresh the page.';
            } else if (error.status === 403) {
                message = 'Access denied.';
            } else if (error.status === 404) {
                message = 'Resource not found.';
            } else if (error.status >= 500) {
                message = 'Server error. Please try again later.';
            } else if (error.responseJSON && error.responseJSON.message) {
                message = error.responseJSON.message;
            }

            if (typeof showGlobalAlert === 'function') {
                showGlobalAlert(message, 'error');
            }

            return message;
        };
    </script>
</body>
</html>
