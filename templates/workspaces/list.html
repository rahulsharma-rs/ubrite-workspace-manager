{% extends 'base.html' %}

{% block title %}Workspaces - UBRITE{% endblock %}

{% block header %}Workspaces{% endblock %}

{% block header_buttons %}
<a href="{{ url_for('workspaces.create_workspace') }}" class="btn btn-primary">
    <span data-feather="plus" style="width: 16px; height: 16px;"></span>
    Create Workspace
</a>
{% endblock %}

{% block content %}
<!-- Modern workspace cards layout instead of table -->
<div id="workspaces-container">
    <div class="text-center" style="padding: 48px;">
        <div class="spinner-border" role="status">
            <span class="visually-hidden">Loading...</span>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    document.addEventListener('DOMContentLoaded', function() {
        loadWorkspaces();

        const socket = io();

        socket.on('workspace_created', function(workspace) {
            loadWorkspaces();
        });

        socket.on('workspace_deleted', function(data) {
            loadWorkspaces();
        });
    });

    function loadWorkspaces() {
        fetch('/workspaces/api/list')
            .then(response => response.json())
            .then(data => {
                const container = document.getElementById('workspaces-container');

                if (data.workspaces.length === 0) {
                    container.innerHTML = `
                        <div class="text-center" style="padding: 48px;">
                            <div style="margin-bottom: 16px;">
                                <span data-feather="folder" style="width: 48px; height: 48px; color: var(--color-fg-muted);"></span>
                            </div>
                            <h3 style="font-size: 20px; margin-bottom: 8px;">No workspaces yet</h3>
                            <p style="color: var(--color-fg-muted); margin-bottom: 24px;">Create your first workspace to get started with DataLENS RC.</p>
                            <a href="{{ url_for('workspaces.create_workspace') }}" class="btn btn-primary">
                                <span data-feather="plus" style="width: 16px; height: 16px;"></span>
                                Create your first workspace
                            </a>
                        </div>
                    `;
                    if (typeof feather !== 'undefined') {
                        feather.replace();
                    }
                    return;
                }

                let html = '<div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(350px, 1fr)); gap: 16px;">';

                data.workspaces.forEach(workspace => {
                    const created = new Date(workspace.created_at).toLocaleDateString('en-US', {
                        year: 'numeric',
                        month: 'short',
                        day: 'numeric'
                    });
                    const lastAccessed = new Date(workspace.last_accessed).toLocaleDateString('en-US', {
                        year: 'numeric',
                        month: 'short',
                        day: 'numeric'
                    });

                    html += `
                        <div class="workspace-card">
                            <div style="display: flex; align-items: start; gap: 12px; margin-bottom: 12px;">
                                <span data-feather="folder" style="width: 20px; height: 20px; color: var(--color-accent-fg); flex-shrink: 0; margin-top: 2px;"></span>
                                <div style="flex: 1; min-width: 0;">
                                    <a href="/workspaces/${workspace.id}" style="text-decoration: none;">
                                        <div class="workspace-card-title">${workspace.name}</div>
                                    </a>
                                    <div style="display: inline-block; padding: 2px 8px; background: var(--color-bg-subtle); border: 1px solid var(--color-border-default); border-radius: 12px; font-size: 12px; color: var(--color-fg-muted); margin-top: 4px;">
                                        ${workspace.env_type}
                                    </div>
                                </div>
                            </div>

                            <div class="workspace-card-meta">
                                <div style="display: flex; align-items: center; gap: 4px;">
                                    <span data-feather="calendar" style="width: 12px; height: 12px;"></span>
                                    Created ${created}
                                </div>
                                <div style="display: flex; align-items: center; gap: 4px;">
                                    <span data-feather="clock" style="width: 12px; height: 12px;"></span>
                                    Last ${lastAccessed}
                                </div>
                            </div>

                            <div style="display: flex; gap: 8px; margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--color-border-default);">
                                <a href="/workspaces/${workspace.id}" class="btn btn-sm btn-secondary" style="flex: 1;">
                                    <span data-feather="eye" style="width: 14px; height: 14px;"></span>
                                    Details
                                </a>
                                <a href="/files/${workspace.id}/explorer" class="btn btn-sm btn-secondary" style="flex: 1;">
                                    <span data-feather="folder" style="width: 14px; height: 14px;"></span>
                                    Files
                                </a>
                            </div>
                        </div>
                    `;
                });

                html += '</div>';

                container.innerHTML = html;

                if (typeof feather !== 'undefined') {
                    feather.replace();
                }
            })
            .catch(error => {
                console.error('Error:', error);
                const container = document.getElementById('workspaces-container');
                container.innerHTML = `
                    <div class="alert alert-danger">
                        Failed to load workspaces. Please try refreshing the page.
                    </div>
                `;
            });
    }
</script>
{% endblock %}
